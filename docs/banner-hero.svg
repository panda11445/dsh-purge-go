<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="dsh-purge · dsh-Go / Android 移植版">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="0.55" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>
    <clipPath id="cardClip"><rect x="60" y="40" width="1080" height="240" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>

  <rect x="60" y="40" width="1080" height="240" rx="28" fill="#ffffff" opacity="0.04" filter="url(#soft)"/>
  <rect x="60" y="40" width="1080" height="240" rx="28" fill="#ffffff" fill-opacity="0.055"/>
  <rect x="60.75" y="40.75" width="1078.5" height="238.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="61" y="41" width="1078" height="120" rx="27" fill="#ffffff" fill-opacity="0.02"/>
  <g clip-path="url(#cardClip)"><rect x="60" y="40" width="1080" height="240" filter="url(#grain)"/></g>

  <rect x="88" y="104" width="3" height="96" rx="1.5" fill="url(#accent)"/>

  <text x="112" y="146" fill="#f8fafc" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="600" letter-spacing="0.5">dsh-purge</text>
  <text x="112" y="192" fill="#c7d2fe" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="400">dsh-Go / Android 移植版</text>
  <text x="112" y="234" fill="#8b95a7" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19">原作 YuJunZhiXue · github.com/YuJunZhiXue/dsh-purge · Apache-2.0</text>

  <rect x="856" y="76" width="218" height="80" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="880" y="112" fill="#e5e7eb" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600">非官方移植</text>
  <text x="880" y="138" fill="#8b95a7" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">二次开发 · 署名保留</text>

  <rect x="856" y="176" width="218" height="52" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="880" y="199" fill="#94a3b8" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">当前版本</text>
  <text x="1004" y="201" fill="#e2e8f0" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600">v1.5.3</text>
</svg>
